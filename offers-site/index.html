/* Layout: dark navy studio page. Hub of 5 build categories -> each opens a Standard vs Premium offer pair -> start screen. */
:root{
  --bg:#0D1B3E; --bg-deep:#091430; --panel:#13265A; --panel-2:#182F6B;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --fg:#F4F6FB; --muted:#A9B6D6; --soft:#7F8DB3;
  --accent:#EF7A3A; --accent-2:#FF9A3C; --ink:#0A0F1F; --good:#5FD3A1;
  --display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:repeating-linear-gradient(124deg,rgba(255,255,255,.035) 0 1px,transparent 1px 34px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-deep)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px;border-radius:8px}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(9,20,48,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--display);font-weight:800;letter-spacing:.06em;font-size:15px}
.brand b{font-weight:800}.brand span{font-weight:600;color:var(--muted)}
.sym{height:34px;width:auto}
.navlinks{display:flex;gap:6px;flex-wrap:wrap}
.navlinks a{text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:999px}
.navlinks a[aria-current="page"],.navlinks a:hover{color:var(--fg);background:var(--panel)}
/* type */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg)}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(38px,6vw,68px);line-height:1.02;font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,3.6vw,40px);line-height:1.08;font-weight:800;letter-spacing:-.01em}
h3{font-size:22px;font-weight:800}
.hl{color:var(--accent)}
.lead{color:var(--muted);font-size:clamp(17px,1.6vw,19px);max-width:62ch;margin:0}
section{padding-block:clamp(48px,7vw,88px)}
.stack{display:grid;gap:20px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:16px;border:0;cursor:pointer;text-decoration:none;font-family:var(--body);font-weight:700;font-size:17px;
  background:var(--accent);color:var(--ink);border-radius:999px;padding:8px 8px 8px 28px;transition:transform .15s}
.btn .dot{width:48px;height:48px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--accent)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line-2)}
.btn.ghost .dot{background:var(--panel)}
.link{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:18px;text-decoration:none;color:var(--fg);padding-bottom:8px;border-bottom:2px solid var(--fg)}
.link:hover{color:var(--accent-2);border-color:var(--accent-2)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:28px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* home */
.hero{padding-block:clamp(64px,10vw,120px)}
.hero .stack{gap:28px;max-width:860px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px dashed var(--line-2);border-radius:16px;padding:16px 18px;color:var(--muted);font-size:14px;max-width:640px}
.note b{color:var(--fg)}
/* hub */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;margin-top:40px}
.cat{position:relative;display:grid;gap:14px;align-content:start;text-decoration:none;background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:28px;transition:transform .18s,border-color .18s;min-width:0}
.cat:hover{transform:translateY(-4px);border-color:var(--accent)}
.cat .ic{width:52px;height:52px;border-radius:14px;background:rgba(239,122,58,.14);color:var(--accent-2);display:grid;place-items:center}
.cat .ic svg{width:26px;height:26px}
.cat p{margin:0;color:var(--muted)}
.cat ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.cat li{font-size:13px;font-weight:600;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.cat .go{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line);font-weight:700}
.cat .go span:last-child{color:var(--accent-2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
@media (min-width:1080px){.cats{grid-template-columns:repeat(3,1fr)}.cat.custom{grid-column:span 2}}
.cat.custom{background:transparent;border-style:dashed;border-color:var(--line-2)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px;margin-top:32px}
.step{display:grid;gap:8px;padding:22px;border-top:2px solid var(--accent)}
.step small{font-family:var(--display);font-weight:800;color:var(--accent-2);letter-spacing:.12em}
.step p{margin:0;color:var(--muted)}
/* category */
.back{display:inline-flex;gap:8px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.back:hover{color:var(--fg)}
.pains{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.pains li{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:8px 14px;border-radius:12px}
.pains li svg{color:#FF8A8A}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px;margin-top:36px;align-items:start}
.offer{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:clamp(24px,3vw,36px);display:grid;gap:22px;min-width:0}
.offer.premium{background:linear-gradient(170deg,#1E3A82,var(--panel) 60%);border:1.5px solid var(--accent);box-shadow:0 30px 80px -40px rgba(239,122,58,.55)}
.tier{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tier .tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.badge{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--ink);padding:6px 12px;border-radius:999px}
.offer .promise{color:var(--muted);margin:6px 0 0}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price strong{font-family:var(--display);font-size:clamp(40px,5vw,54px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:10px}
.meta span{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);padding:7px 12px;border-radius:10px}
.blk h4{margin:0 0 10px;font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{display:flex;gap:12px;align-items:flex-start}
.ticks li svg{color:var(--good);margin-top:3px}
.bonus li svg{color:var(--accent-2)}
.guarantee{display:flex;gap:14px;align-items:flex-start;background:rgba(95,211,161,.08);border:1px solid rgba(95,211,161,.3);border-radius:16px;padding:16px}
.guarantee svg{color:var(--good);width:26px;height:26px}
.guarantee p{margin:0;font-size:15px}
.scarce{font-size:14px;color:var(--accent-2);font-weight:600;margin:0}
.offer .btn{justify-content:space-between;width:100%}
.compare{margin-top:56px;overflow-x:auto;border:1px solid var(--line);border-radius:20px}
.compare table{width:100%;border-collapse:collapse;min-width:560px}
.compare th,.compare td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.compare th{font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);background:var(--bg-deep)}
.compare td:first-child{color:var(--muted)}
.compare tr:last-child td{border-bottom:0}
.faq{display:grid;gap:12px;margin-top:20px;max-width:820px}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.faq summary{cursor:pointer;font-weight:700}
.faq p{color:var(--muted);margin:10px 0 0}
.unsure{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;margin-top:56px;padding:28px;border:1px dashed var(--line-2);border-radius:var(--r)}
/* start */
.summary{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:28px;display:grid;gap:10px;max-width:640px}
.copyrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.copyrow code{font-family:var(--body);font-size:18px;font-weight:700;background:var(--bg-deep);padding:10px 14px;border-radius:10px;user-select:all}
.small-btn{border:1px solid var(--line-2);background:transparent;color:var(--fg);font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;font-family:var(--body)}
form{display:grid;gap:14px;max-width:640px}
label{display:grid;gap:6px;font-weight:600;font-size:14px}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg-deep);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px}
.ok{color:var(--good);font-weight:700}
footer{border-top:1px solid var(--line);color:var(--soft);font-size:14px}
footer .wrap{padding-block:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function home(){return `
<section class="hero"><div class="wrap"><div class="stack">
 <span class="eyebrow">AI Automation Engineer</span>
 <h1>Systems that work on <span class="hl">real data.</span> Not just in demos.</h1>
 <p class="lead">Automation, e-learning, websites and marketing, built by me and my team, packaged so you know exactly what you get and what it costs.</p>
 <div class="row">
  <a class="btn" href="#start">Start a project <span class="dot">${ic('arrow')}</span></a>
  <a class="link" href="#offers">See custom offers ${ic('arrow')}</a>
 </div>
 <div class="note">${ic('bolt')}<span><b>The change on your home page:</b> the "See selected work" link becomes <b>"See custom offers"</b> and opens the offers page. Keep selected work in your menu instead.</span></div>
</div></div></section>`}

function hub(){return `
<section><div class="wrap">
 <div class="stack"><span class="eyebrow">Offers</span>
  <h1>Pick what you need built.<br><span class="hl">See exactly what you get.</span></h1>
  <p class="lead">Every service has two packages: <b style="color:var(--fg)">Standard</b> to get it done fast, and <b style="color:var(--fg)">Premium</b> when you want the full system done for you. Fixed prices, clear timelines, real guarantees.</p></div>
 <div class="cats">${CATS.map(c=>`
  <a class="cat${c.custom?' custom':''}" href="#${c.id}">
   <span class="ic">${ic(c.icon)}</span><h3>${c.name}</h3><p>${c.short}</p>
   <ul>${c.tags.map(t=>`<li>${t}</li>`).join('')}</ul>
   <span class="go"><span>${c.custom?'Standard & Premium options':`${c.std.name} · ${c.pre.name}`}</span><span>View ${ic('arrow')}</span></span>
  </a>`).join('')}</div>
 <div class="steps">
  <div class="step"><small>STEP 1</small><h3>Choose a package</h3><p>Pick the service, then Standard or Premium.</p></div>
  <div class="step"><small>STEP 2</small><h3>Quick call</h3><p>15 minutes to confirm details and your start date.</p></div>
  <div class="step"><small>STEP 3</small><h3>We build</h3><p>Weekly updates until it's live and handed over.</p></div>
 </div>
</div></section>`}

function card(c,o,tier){const p=tier==='Premium';return `
<article class="offer${p?' premium':''}">
 <div class="tier"><span class="tag">${tier}</span>${p?'<span class="badge">Done for you</span>':''}</div>
 <div><h2>${o.name}</h2><p class="promise">${o.promise}</p></div>
 <div class="price"><strong>${o.price}</strong><span>${o.unit}</span></div>
 <div class="meta"><span>${ic('clock')}${o.time}</span></div>
 <div class="blk"><h4>Best for</h4><p style="margin:0">${o.best}</p></div>
 <div class="blk"><h4>What you get</h4><ul class="ticks">${o.inc.map(x=>`<li>${ic('check')}<span>${x}</span></li>`).join('')}</ul></div>
 <div class="blk"><h4>Bonus</h4><ul class="ticks bonus">${o.bonus.map(x=>`<li>${ic('gift')}<span>${x}</span></li>`).join('')}</ul></div>
 <div class="guarantee">${ic('shield')}<p><b>Guarantee.</b> ${o.guar}</p></div>
 ${o.scarce?`<p class="scarce">${o.scarce}</p>`:''}
 <a class="btn${p?'':' ghost'}" href="#start" data-pick="${c.id}|${tier}">Start ${o.name} <span class="dot">${ic('arrow')}</span></a>
</article>`}

function cat(c){const others=CATS.filter(x=>x.id!==c.id&&!x.custom);return `
<section><div class="wrap">
 <a class="back" href="#offers">${ic('back')} All offers</a>
 <div class="stack" style="margin-top:24px"><span class="eyebrow">${c.eyebrow}</span><h1>${c.headline}</h1><p class="lead">${c.lead}</p>
  <ul class="pains" aria-label="Problems this solves">${c.pains.map(p=>`<li>${ic('x')}${p}</li>`).join('')}</ul></div>
 <div class="offers">${card(c,c.std,'Standard')}${card(c,c.pre,'Premium')}</div>
 <div class="compare"><table><thead><tr><th></th><th>${c.std.name}</th><th>${c.pre.name}</th></tr></thead><tbody>
  <tr><td>Price</td><td>${c.std.price} ${c.std.unit}</td><td>${c.pre.price} ${c.pre.unit}</td></tr>
  <tr><td>Timeline</td><td>${c.std.time}</td><td>${c.pre.time}</td></tr>
  <tr><td>Best for</td><td>${c.std.best}</td><td>${c.pre.best}</td></tr>
  <tr><td>Guarantee</td><td>${c.std.guar}</td><td>${c.pre.guar}</td></tr>
 </tbody></table></div>
 <h2 style="margin-top:56px">Questions</h2>
 <div class="faq">
  <details><summary>Can I upgrade from Standard to Premium later?</summary><p>Yes. What you paid for Standard is credited in full if you upgrade within 60 days.</p></details>
  <details><summary>How do payments work?</summary><p>50% to start and 50% on delivery for one-time builds. Monthly packages are billed at the start of each month.</p></details>
  <details><summary>Who does the work?</summary><p>I lead every project personally and work with my team on design, content and development.</p></details>
 </div>
 <div class="unsure"><div><h3>Not sure which one fits?</h3><p class="lead" style="font-size:16px">Tell me about the project and I'll recommend a package, or scope a custom build.</p></div>
  <a class="btn" href="#custom">Custom project <span class="dot">${ic('arrow')}</span></a></div>
 ${c.custom?'':`<p style="color:var(--soft);margin-top:28px">Other services: ${others.map(o=>`<a href="#${o.id}" style="color:var(--fg)">${o.name}</a>`).join(' · ')}</p>`}
</div></section>`}

function start(){const sel=chosen?(()=>{const [id,t]=chosen.split('|');const c=CATS.find(x=>x.id===id);const o=t==='Premium'?c.pre:c.std;return {c,o,t}})():null;return `
<section><div class="wrap"><div class="stack" style="max-width:720px">
 <a class="back" href="${sel?'#'+sel.c.id:'#offers'}">${ic('back')} Back</a>
 <span class="eyebrow">Start a project</span><h1>Let's get it <span class="hl">built.</span></h1>
 ${sel?`<div class="summary"><span class="tag" style="font-family:var(--display);font-weight:800;letter-spacing:.2em;font-size:13px;color:var(--muted)">YOUR PACKAGE</span><h2>${sel.o.name}</h2><p style="margin:0;color:var(--muted)">${sel.c.name} · ${sel.t} · ${sel.o.price} ${sel.o.unit} · ${sel.o.time}</p></div>`:`<p class="lead">Pick a package on the <a href="#offers">offers page</a>, or describe your project below.</p>`}
 <p class="lead">Email me with the package name and a short note about your business. I reply within one business day.</p>
 <div class="copyrow"><code id="em">${EMAIL}</code><button class="small-btn" id="copy" type="button">Copy email</button><span id="copied" class="ok" hidden>Copied</span></div>
 <form id="f"><label for="nm">Your name<input id="nm" required placeholder="Ada Obi"></label>
  <label for="biz">Business / website<input id="biz" placeholder="adaobi.com"></label>
  <label for="msg">What do you want built?<textarea id="msg" rows="4" placeholder="We get 50+ WhatsApp enquiries a day and can't keep up…"></textarea></label>
  <button class="btn" type="submit" style="justify-self:start">Prepare my message <span class="dot">${ic('arrow')}</span></button>
  <p id="done" hidden class="ok">Your message is ready below. Copy it and send it to ${EMAIL}.</p>
  <textarea id="out" rows="6" hidden readonly></textarea>
 </form>
</div></div></section>`}

function render(){const h=(location.hash||'#home').slice(1);let html;
 if(h==='offers')html=hub();else if(h==='start')html=start();else{const c=CATS.find(x=>x.id===h);html=c?cat(c):home()}
 app.innerHTML=html;window.scrollTo(0,0);
 document.querySelectorAll('.navlinks a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+h||(h==='home'&&a.getAttribute('href')==='#home')?'page':'false'));
 app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.pick}));
 const cp=document.getElementById('copy');if(cp)cp.onclick=()=>{const done=()=>{document.getElementById('copied').hidden=false};
  try{navigator.clipboard.writeText(EMAIL).then(done,()=>{getSelection().selectAllChildren(document.getElementById('em'))})}catch(e){getSelection().selectAllChildren(document.getElementById('em'))}};
 const f=document.getElementById('f');if(f)f.onsubmit=e=>{e.preventDefault();const pk=chosen?chosen.replace('|',' – '):'Custom project';
  const out=document.getElementById('out');out.value=`Hi Xavier,\n\nI'm interested in: ${pk}\nName: ${document.getElementById('nm').value}\nBusiness: ${document.getElementById('biz').value}\n\n${document.getElementById('msg').value}`;
  out.hidden=false;document.getElementById('done').hidden=false;out.select()};
}
addEventListener('hashchange',render);render();
</script>
</body>
</html>
