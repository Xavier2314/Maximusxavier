<style>
.vxo{--o-panel:#13265A;--o-panel2:#182F6B;--o-deep:#091430;--o-line:rgba(255,255,255,.10);--o-line2:rgba(255,255,255,.18);--o-fg:#F4F6FB;--o-muted:#A9B6D6;--o-soft:#7F8DB3;--o-acc:#EF7A3A;--o-acc2:#FF9A3C;--o-ink:#0A0F1F;--o-good:#5FD3A1;color:var(--o-fg)}
.vxo .o-stack{display:grid;gap:20px}
.vxo .o-h1{font-size:clamp(38px,6vw,68px);line-height:1.02;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}

.vxo .o-h3{font-size:21px;font-weight:800;margin:0}
.vxo .o-hl{color:var(--o-acc)}
.vxo .o-lead{color:var(--o-muted);font-size:clamp(17px,1.6vw,19px);max-width:62ch;margin:0}
.vxo svg.o-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vxo .o-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:40px}
@media (min-width:1080px){.vxo .o-cats{grid-template-columns:repeat(3,1fr)}.vxo .o-cat.o-custom{grid-column:span 2}}
.vxo .o-cat{display:grid;gap:14px;align-content:start;text-decoration:none;color:inherit;background:linear-gradient(160deg,var(--o-panel2),var(--o-panel));border:1px solid var(--o-line);border-radius:22px;padding:28px;transition:transform .18s,border-color .18s;min-width:0}
.vxo .o-cat:hover{transform:translateY(-4px);border-color:var(--o-acc)}
.vxo .o-cat.o-custom{background:transparent;border-style:dashed;border-color:var(--o-line2)}
.vxo .o-ic{width:52px;height:52px;border-radius:14px;background:rgba(239,122,58,.14);color:var(--o-acc2);display:grid;place-items:center}
.vxo .o-ic svg{width:26px;height:26px}
.vxo .o-cat p{margin:0;color:var(--o-muted)}
.vxo .o-tags{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.vxo .o-tags li{font-size:13px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--o-line);padding:5px 11px;border-radius:999px}
.vxo .o-go{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid var(--o-line);font-weight:700}
.vxo .o-go span:last-child{color:var(--o-acc2);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.vxo .o-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px;margin-top:32px}
.vxo .o-step{display:grid;gap:8px;padding:22px;border-top:2px solid var(--o-acc)}
.vxo .o-step small{font-weight:800;color:var(--o-acc2);letter-spacing:.12em}
.vxo .o-step p{margin:0;color:var(--o-muted)}
.vxo .o-back{display:inline-flex;gap:8px;align-items:center;color:var(--o-muted);text-decoration:none;font-weight:600;font-size:14px}
.vxo .o-back:hover{color:var(--o-fg)}
.vxo .o-pains{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.vxo .o-pains li{display:flex;align-items:center;gap:8px;color:var(--o-muted);font-size:15px;background:rgba(255,255,255,.04);border:1px solid var(--o-line);padding:8px 14px;border-radius:12px}

.vxo .o-tier{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.vxo .o-tag{font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--o-muted)}
.vxo .o-badge{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--o-acc);color:var(--o-ink);padding:6px 12px;border-radius:999px}
.vxo .o-promise{color:var(--o-muted);margin:6px 0 0}
.vxo .o-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vxo .o-price strong{font-size:clamp(40px,5vw,54px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vxo .o-price span{color:var(--o-muted);font-weight:600}
.vxo .o-meta span{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(255,255,255,.06);padding:7px 12px;border-radius:10px}
.vxo .o-blk h4{margin:0 0 10px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--o-soft)}
.vxo .o-blk p{margin:0}
.vxo .o-ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.vxo .o-ticks li{display:flex;gap:12px;align-items:flex-start}
.vxo .o-ticks li svg{color:var(--o-good);margin-top:3px}
.vxo .o-bonus li svg{color:var(--o-acc2)}
.vxo .o-guar{display:flex;gap:14px;align-items:flex-start;background:rgba(95,211,161,.08);border:1px solid rgba(95,211,161,.3);border-radius:16px;padding:16px}
.vxo .o-guar svg{color:var(--o-good);width:26px;height:26px}
.vxo .o-guar p{margin:0;font-size:15px}
.vxo .o-scarce{font-size:14px;color:var(--o-acc2);font-weight:600;margin:0}
.vxo .o-full{width:100%;justify-content:space-between}
.vxo .o-compare{margin-top:56px;overflow-x:auto;border:1px solid var(--o-line);border-radius:20px}
.vxo .o-compare table{width:100%;border-collapse:collapse;min-width:560px}
.vxo .o-compare th,.vxo .o-compare td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--o-line);font-size:15px;vertical-align:top}
.vxo .o-compare th{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--o-soft);background:var(--o-deep)}
.vxo .o-compare td:first-child{color:var(--o-muted)}
.vxo .o-compare tr:last-child td{border-bottom:0}
.vxo .o-faq{display:grid;gap:12px;margin-top:20px;max-width:820px}
.vxo .o-faq details{background:var(--o-panel);border:1px solid var(--o-line);border-radius:16px;padding:16px 20px}
.vxo .o-faq summary{cursor:pointer;font-weight:700}
.vxo .o-faq p{color:var(--o-muted);margin:10px 0 0}
.vxo .o-unsure{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;margin-top:56px;padding:28px;border:1px dashed var(--o-line2);border-radius:22px}
.vxo .o-unsure p{margin:6px 0 0;color:var(--o-muted)}
.vxo .o-summary{background:var(--o-panel);border:1px solid var(--o-acc);border-radius:22px;padding:28px;display:grid;gap:10px;max-width:640px}
.vxo .o-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.vxo .o-mail{font-size:18px;font-weight:700;background:var(--o-deep);padding:10px 14px;border-radius:10px;user-select:all}
.vxo .o-small{border:1px solid var(--o-line2);background:transparent;color:var(--o-fg);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
.vxo .o-ok{color:var(--o-good);font-weight:700}
.vxo .o-other{color:var(--o-soft);margin-top:28px}
.vxo .o-other a{color:var(--o-fg)}
@media (prefers-reduced-motion:reduce){.vxo *{transition:none!important}}

</div>
<div class="o-unsure"><div><h3 class="o-h3">Not sure which one fits?</h3><p>Tell me about the project and I'll recommend a package, or scope a custom build.</p></div>${btn('#custom','Custom project')}</div>
${c.custom?'':`<p class="o-other">Other services: ${others.map(o=>`<a href="#${o.id}">${o.name}</a>`).join(' · ')}</p>`}`}
function start(){const sel=chosen?(()=>{const [id,t]=chosen.split('|');const c=CATS.find(x=>x.id===id);return {c,o:t==='Premium'?c.pre:c.std,t}})():null;return `
<div class="o-stack" style="max-width:720px">
 <a class="o-back" href="${sel?'#'+sel.c.id:'#offers'}">${ic('back')} Back</a>
 <p class="eyebrow eyebrow--dot">Start a project</p><h1 class="o-h1">Let's get it <span class="o-hl">built.</span></h1>
 ${sel?`<div class="o-summary"><span class="o-tag">Your package</span><h2 class="o-h2">${sel.o.name}</h2><p style="margin:0;color:var(--o-muted)">${sel.c.name} · ${sel.t} · ${sel.o.price} ${sel.o.unit} · ${sel.o.time}</p></div>`:''}
 <p class="o-lead">Send me the package name and a short note about your business through the contact form, or email me directly. I reply within one business day.</p>
 <div class="o-row">${btn('/contact/','Open the contact form')}<span class="o-mail" id="vxo-em">${EMAIL}</span><button class="o-small" id="vxo-copy" type="button">Copy email</button><span id="vxo-copied" class="o-ok" hidden>Copied</span></div>
</div>`}
function render(){const h=(location.hash||'#offers').slice(1);const c=CATS.find(x=>x.id===h);
 app.innerHTML=h==='start'?start():c?cat(c):hub();
 if(location.hash)window.scrollTo(0,0);
 app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.pick}));
 const cp=document.getElementById('vxo-copy');if(cp)cp.onclick=()=>{const sel=()=>getSelection().selectAllChildren(document.getElementById('vxo-em'));
  try{navigator.clipboard.writeText(EMAIL).then(()=>{document.getElementById('vxo-copied').hidden=false},sel)}catch(e){sel()}};
}
addEventListener('hashchange',render);render();
})();
</script>
